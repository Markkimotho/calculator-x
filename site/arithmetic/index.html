<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>calculator-x</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main class="shell">
    <header>
      <p class="eyebrow">a small thing for everyday maths</p>
      <h1>calculator<span>-x</span></h1>
      <p>Numbers, a little history, and a keyboard if you prefer it.</p>
    </header>
    <section class="calculator" aria-label="Calculator">
      <div class="screen" aria-live="polite" aria-atomic="true"><p id="expression">Ready</p><output id="display">0</output></div>
      <div class="keys">
        <button data-action="clear">AC</button><button data-action="sign">±</button><button data-action="percent">%</button><button data-operator="/">÷</button>
        <button data-digit="7">7</button><button data-digit="8">8</button><button data-digit="9">9</button><button data-operator="*">×</button>
        <button data-digit="4">4</button><button data-digit="5">5</button><button data-digit="6">6</button><button data-operator="-">−</button>
        <button data-digit="1">1</button><button data-digit="2">2</button><button data-digit="3">3</button><button data-operator="+">+</button>
        <button data-action="backspace" aria-label="Delete last digit">⌫</button><button data-digit="0">0</button><button data-action="decimal">.</button><button data-action="equals" class="equals">=</button>
      </div>
    </section>
    <aside class="history" aria-label="Recent calculations">
      <div class="history-head"><h2>Recent</h2><button id="clear-history">Clear history</button></div>
      <ol id="history-list"><li class="empty">Your last five calculations will appear here.</li></ol>
    </aside>
    <p class="footnote">Keyboard: 0–9, + − × ÷, Enter, Backspace, Escape.</p>
  </main>
</body>
</html>
